{% extends 'base.html' %}
{% block content %}
<section class="surface p-4 mx-auto" id="admin-login-panel">
  <p class="eyebrow">ÁREA RESERVADA</p><h1 class="h3 mb-4">Entrar na administração</h1>
  {% if error %}<p class="alert alert-danger" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('admin_login_submit') }}">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email" class="form-label">Email</label><input class="form-control mb-3" id="email" name="email" type="email" maxlength="254" autocomplete="username" required>
    <label for="password" class="form-label">Palavra-passe</label><input class="form-control mb-4" id="password" name="password" type="password" maxlength="128" autocomplete="current-password" required>
    <button class="btn btn-brand w-100" type="submit">Entrar</button>
  </form>
</section>
{% endblock %}
